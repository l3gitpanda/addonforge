name: Build and test

on:
  pull_request:
    paths-ignore:
      - "catalog/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "catalog/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One platform failing still lets the other finish, so both results show.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Security check
        run: node scripts/security-check.mjs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      # Each platform's own code (Windows shell calls, macOS Keychain) is linted where it compiles.
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: UI checks
        run: node scripts/test-ui.js
