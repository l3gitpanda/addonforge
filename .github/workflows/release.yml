name: Release

# Every push to main that changes the app builds it on Windows and publishes a
# GitHub release tagged v<version>-b<build> with the portable exe and the
# installer. Run it by hand from the Actions tab to release the current main.
#
# Not done here, compared with build.ps1 -Release: no Defender scan and no
# signed latest.json. Self-update is off in this fork (selfupdate.rs
# UPDATE_CHANNEL = None), so nothing reads latest.json yet.

on:
  push:
    branches: [main]
    paths-ignore:
      - "catalog/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick pushes cannot pick the same build number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Security check
        run: node scripts/security-check.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      - name: UI checks
        run: node scripts/test-ui.js

      - name: Version and build number
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version must be x.y.z (got '$version')" }
          # Next build = highest b<N> among this repo's releases + 1. Starts
          # after upstream's last build (31) so numbers never look like theirs.
          $last = 31
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "could not list releases" }
          foreach ($t in $tags) { if ($t -match '-b(\d+)$' -and [int]$Matches[1] -gt $last) { $last = [int]$Matches[1] } }
          $build = $last + 1
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build"     >> $env:GITHUB_OUTPUT
          "tag=v$version-b$build" >> $env:GITHUB_OUTPUT
          Write-Host "AddonForge v$version build $build"

      - name: Install Tauri CLI
        run: npm ci
      - name: Build exe and installer
        env:
          ADDONFORGE_BUILD: ${{ steps.ver.outputs.build }}   # baked into the exe (selfupdate::build)
        run: npx tauri build --bundles nsis

      - name: Collect release files
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"; $b = "${{ steps.ver.outputs.build }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/addonforge.exe "out/AddonForge-v$v-b$b.exe"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "out/AddonForge-Setup-v$v-b$b.exe"
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $notes = @"
          Built by GitHub Actions from $env:GITHUB_SHA.

          - ``AddonForge-Setup-$tag.exe``: installs to your user folder with a Start menu shortcut and an uninstaller, no admin rights needed.
          - ``AddonForge-$tag.exe``: portable, run it from anywhere.

          Windows 10/11. Not code-signed, so SmartScreen may show an unknown-publisher warning. This build does not update itself; check SHA256SUMS.txt against your download.
          "@
          gh release create $tag (Get-ChildItem out).FullName `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "AddonForge $tag" --notes $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
