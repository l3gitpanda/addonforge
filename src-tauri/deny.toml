# cargo-deny: what the dependency tree may contain. CI runs `cargo deny check`
# (see .github/workflows/build.yml); run it locally from src-tauri/.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms AddonForge is built for. Linux-only crates (GTK, WebKitGTK)
# are not in any build, so their advisories and licences are not ours to judge.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# The RustSec database: known vulnerabilities fail the check, and so do crates
# their authors have marked unmaintained or yanked from crates.io. An exception
# goes in `ignore` with the advisory id and a reason, never silently.
version = 2
yanked = "deny"
unmaintained = "all"
# Checked 13 November 2026. Unmaintained only (no known vulnerability), and
# not ours to replace: revisit when the crate that pulls them in moves on.
ignore = [
    # paste: a compile-time macro, reached only through image-blp -> image 0.24
    # -> exr -> pulp. No code of it runs in the app.
    { id = "RUSTSEC-2024-0436", reason = "compile-time only, via image-blp's image 0.24" },
    # unic-*: Tauri's own dependency (tauri-utils -> urlpattern).
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range, via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common, via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property, via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, via tauri-utils -> urlpattern" },
]

[licenses]
version = 2
# Permissive licences, plus MPL-2.0 (file-level copyleft: the HTML/CSS parser
# Tauri uses). Nothing that would put conditions on AddonForge's own code.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are normal in a Tauri tree; say so, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies are not wildcards.
allow-wildcard-paths = true

[sources]
# Crates only from crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
